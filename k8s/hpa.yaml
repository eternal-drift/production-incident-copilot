apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: incident-copilot-app-hpa
  namespace: incident-copilot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: incident-copilot-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
