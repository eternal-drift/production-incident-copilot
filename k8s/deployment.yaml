apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-copilot-app
  namespace: incident-copilot
  labels:
    app: incident-copilot-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: incident-copilot-app
  template:
    metadata:
      labels:
        app: incident-copilot-app
    spec:
      containers:
        - name: app
          image: incident-copilot-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: incident-copilot-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: incident-copilot-secrets, key: POSTGRES_PASSWORD } }
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: incident-copilot-secrets, key: API_KEY } }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 15
