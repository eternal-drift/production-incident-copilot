# LiteLLM proxy config — routes model calls through Ollama, giving the
# app a single OpenAI-compatible endpoint regardless of which provider
# is behind it. Add an external provider block here later to demo the
# "swap providers without touching app code" story without incurring
# cost by default.
model_list:
  - model_name: qwen2.5:7b
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://ollama:11434

litellm_settings:
  drop_params: true

general_settings:
  master_key: sk-local
